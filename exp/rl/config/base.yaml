# @package _global_
# Compose this as the primary Hydra config, then merge algorithm/hardware overlays.
defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

data:
  train_files: null
  val_files: null
  train_batch_size: 32
  gen_batch_size: 8
  val_batch_size: 32
  max_prompt_length: 4096
  max_response_length: 2048
  dataloader_num_workers: 0
  filter_overlong_prompts: false
  truncation: error
  validation_shuffle: false
  seed: 42
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  hybrid_engine: true
  model:
    # The launcher injects the original local Qwen3-0.6B model by default.
    path: null
    trust_remote_code: false
    enable_gradient_checkpointing: true
    use_remove_padding: false
    use_fused_kernels: false
    use_liger: false
    lora_rank: 0
    lora:
      rank: 0
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    use_torch_compile: false
    use_kl_loss: false
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    loss_agg_mode: seq-mean-token-mean
    policy_loss:
      loss_mode: vanilla
    optim:
      lr: 1.0e-6
    fsdp_config:
      strategy: fsdp
      model_dtype: bfloat16
      dtype: bfloat16
      param_offload: true
      optimizer_offload: false
      ulysses_sequence_parallel_size: 1
      use_torch_compile: false
  ref:
    use_torch_compile: false
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      strategy: fsdp
      model_dtype: bfloat16
      dtype: bfloat16
      param_offload: true
      ulysses_sequence_parallel_size: 1
      use_torch_compile: false
  rollout:
    name: vllm
    mode: async
    dtype: bfloat16
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    pipeline_model_parallel_size: 1
    n: 8
    do_sample: true
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    seed: 42
    prompt_length: 4096
    response_length: 2048
    max_model_len: 6144
    max_num_batched_tokens: 8192
    max_num_seqs: 32
    gpu_memory_utilization: 0.45
    enable_chunked_prefill: true
    enable_prefix_caching: true
    enforce_eager: true
    free_cache_engine: true
    ignore_eos: false
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      num_workers: 8
      default_agent_loop: single_turn_agent
    val_kwargs:
      n: 1
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: -1
    checkpoint_engine:
      backend: naive

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: reward
    max_num_gen_batches: 0
    max_inflight_gen_batches: 1

critic:
  enable: false

reward:
  num_workers: 8
  reward_manager:
    source: importlib
    name: IGSMRewardManager
    module:
      path: null
      name: igsm_reward_manager
  custom_reward_function:
    path: null
    name: compute_score
  reward_model:
    enable: false

distillation:
  enabled: false

trainer:
  use_v1: true
  v1:
    trainer_mode: sync
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 10
  project_name: igsm_rl
  logger: [console]
  val_before_train: false
  test_freq: -1
  save_freq: -1
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  default_hdfs_dir: null
  default_local_dir: null
  resume_mode: disable

igsm_rl:
  algorithm: grpo
  run_dir: null
  patience: 2
  max_generation_batches: 16
  generation_timeout_s: 1800
