# @package _global_
# Merge over composed base.yaml; this is not a standalone Hydra primary config.
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  filter_groups:
    enable: false

actor_rollout_ref:
  actor:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    loss_agg_mode: seq-mean-token-mean

igsm_rl:
  algorithm: grpo
